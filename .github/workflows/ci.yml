name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-offline-checks:
    name: Lint + ontology (offline, no cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling deps
        run: |
          python -m pip install --upgrade pip
          pip install rdflib
      - name: Python syntax
        run: python -m py_compile $(git ls-files '*.py' | tr '\n' ' ')
      - name: Ontology hygiene contract
        run: python tools/ontology_hygiene.py
      - name: Ontology A/B (top-1 regression, offline)
        run: |
          python tools/ontology_scoring_verify.py \
            --parent "$(python - <<'PY'
import json
print(json.load(open('.evoontology/active.json'))['active_version'])
PY
)" --active "$(python - <<'PY'
import json
print(json.load(open('.evoontology/active.json'))['active_version'])
PY
)" --top-k 1 --json-out .chaos/ontology_scoring_ab.json

  smoke:
    name: Compose smoke + environment doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bring the cluster up
        run: docker compose -f rca-agent/docker-compose.yml up -d --build
      - name: Wait for services
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8088/api/health >/dev/null; then break; fi
            sleep 5
          done
      - name: Seed the synthetic dataset
        run: python tools/fault_injector.py seed
      - name: Doctor (18 checks)
        run: python tools/fault_injector.py doctor
      - name: Logs on failure
        if: failure()
        run: docker compose -f rca-agent/docker-compose.yml logs --tail 80
      - name: Tear down
        if: always()
        run: docker compose -f rca-agent/docker-compose.yml down -v
