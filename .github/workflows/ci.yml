name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-offline-checks:
    name: Lint + ontology (offline, no cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling deps
        run: |
          python -m pip install --upgrade pip
          pip install rdflib pyyaml
      # 只编**首方**代码：vendor/ 是上游第三方，全仓 py_compile 失败时无法判断是谁的问题。
      - name: Python syntax (first-party only)
        run: |
          mkdir -p .chaos
          python -m py_compile $(git ls-files 'tools/*.py' 'tools/**/*.py' \
            'rca-agent/backend/*.py' 'rca-agent/backend/**/*.py' 'demo/*.py' 'demo/**/*.py' \
            | tr '\n' ' ')
      - name: Ontology hygiene contract
        run: python tools/ontology_hygiene.py
      - name: Ontology A/B (top-1 regression, offline)
        run: |
          mkdir -p .chaos
          read -r PARENT ACTIVE <<< "$(python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from tools.run_all_verification import _active_versions
          v = _active_versions()
          print(v.get("prev_version") or "-", v.get("active_version") or "-")
          PY
          )"
          echo "active=$ACTIVE parent=$PARENT"
          if [ "$PARENT" = "-" ] || [ -z "$PARENT" ]; then
            echo "::notice::no previous published version in this checkout — skipping the A/B gate"
            exit 0
          fi
          python tools/ontology_scoring_verify.py --parent "$PARENT" --active "$ACTIVE" \
            --top-k 1 --json-out .chaos/ontology_scoring_ab.json

  smoke:
    name: Compose smoke + environment doctor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml rdflib
      - name: Bring the cluster up
        run: |
          mkdir -p .chaos
          docker compose -f rca-agent/docker-compose.yml up -d --build
      # ── 关键缺失步骤 ────────────────────────────────────────────────────
      # 复制与几何 schema 不是 compose 建的：`cluster_bootstrap.py` 才负责
      # 建 schema 并把副本指向主库（CHANGE REPLICATION SOURCE TO ... START REPLICA）。
      # 漏了它，副本会是**空实例**（无 appuser / 无表 / 复制为空），
      # 表现就是 doctor 的「读路径 Access denied」+ 两条「replication FAIL」。
      - name: Bootstrap the cluster (schema + replication)
        run: python tools/cluster_bootstrap.py
      - name: Seed the synthetic dataset
        run: python tools/fault_injector.py seed
      # 注意顺序：这个门用的就是 doctor，而 doctor 含「测试体量 t_txn」检查。
      # 若把 seed 放在门之后，门**永远不可能通过**（会白重试到超时）。
      - name: Wait for the stack to converge (doctor retry gate)
        run: |
          for i in $(seq 1 15); do
            echo "── attempt $i ──"
            if python tools/fault_injector.py doctor; then
              echo "::notice::doctor passed after $i attempt(s)"
              exit 0
            fi
            echo "::group::diagnostics (attempt $i)"
            docker compose -f rca-agent/docker-compose.yml ps --format \
              'table {{.Service}}\t{{.State}}\t{{.Status}}' || true
            echo "--- prometheus up series ---"
            curl -s 'http://127.0.0.1:9090/api/v1/query?query=up' | head -c 1200 || true
            echo
            echo "--- app targets seen by prometheus ---"
            curl -s 'http://127.0.0.1:9090/api/v1/query?query=count(up{job=%22payment-app%22})' \
              | head -c 400 || true
            echo
            echo "--- blackbox probe series ---"
            curl -s 'http://127.0.0.1:9090/api/v1/query?query=probe_success' | head -c 400 || true
            echo
            echo "--- logs (tail) ---"
            docker compose -f rca-agent/docker-compose.yml logs --tail 12 2>&1 | tail -n 120 || true
            echo "::endgroup::"
            sleep 20
          done
          echo "::error::doctor still failing after 15 attempts"
          exit 1
      - name: Doctor (18 checks, final)
        run: python tools/fault_injector.py doctor
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f rca-agent/docker-compose.yml ps
          docker compose -f rca-agent/docker-compose.yml logs --tail 60
      - name: Tear down
        if: always()
        run: docker compose -f rca-agent/docker-compose.yml down -v
