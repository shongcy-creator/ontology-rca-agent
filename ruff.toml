# ruff 配置 —— CI 里的 `ruff check tools/ rca-agent/backend/` 就是读这份。
#
# 存在的理由：这个门加进来的时候是**红的**（默认规则集下 110 条），而
# "结构上不可能通过的门"恰好是本仓库 CONTRIBUTING 第 10 条明令禁止的东西 ——
# 它测不出任何东西，只会让人学会无视红色。
#
# 所以这里把规则集**显式收窄到"缺陷类"**，并把每条排除规则连同**实测条数**
# 一起写在下面，而不是把整仓格式化一遍去迁就一个默认值。
# 下列数字均为 `ruff check --select <规则> tools/ rca-agent/backend/` 的实测值。
target-version = "py311"

[lint]
#   F    —— 未使用导入/变量、未定义名、重复定义。真缺陷，是最该当门的一组。
#   PIE  —— 多余的 pass / 可合并的判断等。实测 2 条，已修。
#   RET  —— 冗余 return / return 之后多余的 else。实测 3 条，已修。
#
# 刻意**不**选（括号内为加入时实测的违规数）：
#   E（1359）—— 被 E501（行宽）淹没：本项目的注释是中文散文，用行宽约束它没有意义。
#                E402 同样不适用：多个 tools 脚本刻意在 `sys.path.insert(...)` 之后再导入，
#                本来就带 `# noqa: E402`。
#   UP（2787）—— 绝大多数是 UP031（`%` 格式化改写为 f-string）与 UP009（多余 UTF-8 声明）。
#                这两者在本仓库都是**刻意**的：`%` 格式化是全文一致的行文风格，
#                `# -*- coding: utf-8 -*-` 是显式声明。要改是另一轮的事，不该混进门禁。
#   I（85）—— 会与"先改 sys.path 再导入"这个刻意模式冲突。
#   SIM（52）—— 简化建议多为改写既有惯用写法，噪声大于收益。
#   B（26）—— 其中 8 条是 B008，即 FastAPI 的 `Body(...)` 参数默认值写法
#              （ruff 官方文档就建议对 FastAPI 忽略该规则）；余下 B904/B905/B007
#              需要**逐处判断语义**才能改，尤其 B905（zip 缺 strict=）会改动已经
#              产出过证据的报告脚本。要做可以，但该单独一轮。
#   RUF100 —— 会让现存的 `# noqa: BLE001` 变成"多余 noqa"而报错（B 未启用）。
#              留着这些 noqa 是刻意的：它们记录了"这里曾经因为盲 except 出过事"。
select = ["F", "PIE", "RET"]

# 不设 per-file-ignores：上面这组规则在仓库里是全绿的。
# 一旦需要文件粒度的例外，说明规则选错了，而不是需要打补丁。
