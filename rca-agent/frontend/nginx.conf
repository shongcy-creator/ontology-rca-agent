server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── 上游重解析（踩过的坑，必须这么写）────────────────────────────────
    # `proxy_pass http://rca-agent-backend:8088;` 这种**字面主机名**写法，
    # nginx 只在**启动时**解析一次并把 IP 缓存到 worker 生命周期结束。
    # 于是后端容器一旦被重建（换 IP），前端就永久 502 —— 而 `docker ps` 里
    # 后端是 healthy、直连 8088 也是 200，只有走 nginx 的那条路断了。
    # 这类"所有健康检查都绿、功能却全挂"最难查，所以这里用 Docker 内嵌 DNS
    # （127.0.0.11）+ 变量，让 nginx **按 valid 周期重新解析**。
    # 注意：proxy_pass 带变量时，nginx 会原样透传**原始请求 URI**
    # （本例就是要透传 /api/... 不变，因此正合适）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    # 注意：Agent 诊断最长运行 RCA_AGENT_TIMEOUT_S（默认 180s），
    # 因此 proxy_read_timeout 必须显著大于该值，否则前端会收到 504。
    location /api/ {
        set $backend_upstream http://rca-agent-backend:8088;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # SSE / 流式响应支持（P2）
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
