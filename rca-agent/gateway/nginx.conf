# =============================================================================
# 应用层网关（Gateway / Load Balancer）
# -----------------------------------------------------------------------------
# 把 payment-app 的 N 个副本聚合成一个对外入口 :8080。
#
# 关键设计：
#   · upstream 用 Docker 内嵌 DNS 的 service 名 `payment-app`，由 Docker DNS
#     返回全部副本 IP（compose 服务多副本时是 DNS RR），并用 resolve 让 Nginx
#     定期重新解析，从而跟随副本扩缩容。
#   · ip_hash 关闭 -> 轮询；保留 realip 与 X-Instance 头，让 RCA 能定位到
#     "哪个副本出的问题"（集群化后这是新的诊断维度）。
#   · /gateway/status 暴露各副本的探活结果（LB 视角的集群健康）。
# =============================================================================

user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format lb '$remote_addr - [$time_local] "$request" $status '
                  '$body_bytes_sent rt=$request_time upstream=$upstream_addr '
                  'ustatus=$upstream_status urt=$upstream_response_time';
    access_log /var/log/nginx/access.log lb;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    client_max_body_size 1m;

    # ── 应用副本池 ────────────────────────────────────────────────
    # Docker DNS 对 compose 服务名返回所有副本地址；resolver 127.0.0.11 是
    # Docker 内嵌 DNS。valid=5s 让扩容/缩容在 5 秒内被网关感知。
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream payment_app_pool {
        zone payment_app_pool 64k;
        least_conn;
        server payment-app:8080 resolve;
        keepalive 32;
    }

    # LB 自身的健康视图（/gateway/status）
    server {
        listen 8080;
        server_name _;

        # ── 负载均衡到应用副本 ────────────────────────────────────
        location / {
            proxy_pass         http://payment_app_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # 故障期间上游可能变慢：给 RCA 留出可观测的超时窗口
            proxy_connect_timeout 2s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # 单副本故障时快速摘除，避免把错误放大到整层
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # ── 网关自身的运行状态 ───────────────────────────────────
        location = /gateway/status {
            default_type application/json;
            return 200 '{"gateway":"app-gateway","upstream":"payment_app_pool","strategy":"least_conn","resolver":"docker-dns","ok":true}';
        }

        location = /gateway/health {
            access_log off;
            default_type application/json;
            return 200 '{"ok":true,"gateway":"app-gateway"}';
        }

        # 让 Nginx 自身的 stub_status 也有落点（可选观测）
        location = /gateway/metrics {
            stub_status;
            access_log off;
        }
    }
}
